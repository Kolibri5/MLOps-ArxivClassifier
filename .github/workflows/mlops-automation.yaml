name: MLOps Continuous Training (CT) Pipeline

# DEFINISI SKENARIO PEMICU (TRIGGERS)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Mengizinkan eksekusi manual dari UI GitHub
  repository_dispatch:
    types: [grafana-alert-drift, grafana-alert-accuracy] # Skenario A & B: Webhook dari Alert Grafana
  schedule:
    - cron: '0 0 * * 0' # Skenario C: Jadwal Rutin (Setiap hari Minggu jam 00:00 UTC)
    
jobs:
  continuous-training:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

    - name: Jalankan MLflow Server Background
      run: |
        nohup mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 127.0.0.1 --port 5000 > /dev/null 2>&1 &
        sleep 5

    - name: Tahap 1 - Automated Testing
      run: |
        pytest tests/

    - name: Tahap 1.5 - Prepare Data (Ingest & Preprocess)
      run: |
        python src/processing/preprocess.py

    - name: Tahap 2 - Automated Training
      run: |
        python src/intelligence/train.py --n_estimators 100 --max_depth 10

    - name: Tahap 3 & 4 - Model Evaluation & Auto-Registry
      run: |
        python src/intelligence/evaluate_and_register.py
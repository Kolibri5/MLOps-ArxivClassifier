version: '3.8'

services:
  # Layanan Metadata & Model Registry
  mlflow-server:
    image: python:3.10-slim
    container_name: mlflow_server
    ports:
      - "5000:5000"
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "pip install mlflow && mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root mlflow-artifacts:/ --serve-artifacts --host 0.0.0.0 --port 5000 --allowed-hosts mlflow-server,mlflow-server:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    networks:
      - mlops-network

  # Layanan Inferensi (API)
  api-service:
    build: .
    # container_name: fastapi_inference
    ports:
      - "8000-8002:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ./:/app
    env_file:
      - .env
    deploy:
      replicas: 3
    depends_on:
      - mlflow-server
    networks:
      - mlops-network

  # Layanan Scraper Metrik
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - mlops-network

  # Layanan Dashboard Visualisasi
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

volumes:
  grafana_data:
  prometheus_data:
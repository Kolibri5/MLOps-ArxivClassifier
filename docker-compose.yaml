version: '3.8'

services:
  # Layanan Metadata & Model Registry
  mlflow-server:
    image: python:3.10-slim
    container_name: mlflow_server
    ports:
      - "5000:5000"
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "pip install mlflow && mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root mlflow-artifacts:/ --serve-artifacts --host 0.0.0.0 --port 5000 --allowed-hosts mlflow-server,mlflow-server:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    networks:
      - mlops-network

  # Layanan Inferensi (API)
  api-service:
    build: .
    container_name: fastapi_inference
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ./:/app
    depends_on:
      - mlflow-server
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge